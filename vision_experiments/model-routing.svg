<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1050" viewBox="0 0 1080 1050" role="img" aria-labelledby="title desc"><title id="title">See2Hear model routing</title><desc id="desc">One category per query. A detector provides a box for guidance. After stable centering the sign reader reads the selected crop; a category-specific distance model reads scene, crop and geometry. Numbered gate requests require a matching digit before distance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#586980"/></marker></defs>
<rect x="0" y="0" width="1080" height="1050" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/>
<text x="32" y="46" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#152e43">How a camera frame becomes a sign reading</text>
<text x="32" y="78" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#152e43">Follow the column for the active query. Each column has its own trained weights.</text>
<rect x="32" y="101" width="1016" height="58" rx="10" fill="#18374b" stroke="none" stroke-width="1.5"/>
<text x="540" y="137" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="white">Upright RGB frame  +  query category  +  optional requested gate number</text>
