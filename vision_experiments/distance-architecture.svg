<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830" viewBox="0 0 1080 830" role="img" aria-labelledby="title desc"><title id="title">Distance estimator architecture and tensor shapes</title><desc id="desc">Separate scene, sign crop and geometry branches produce 12, 12 and 32 features. They merge into 56 features and a classifier outputs three distance scores.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L9 5 L0 10Z" fill="#566b78"/></marker></defs>
<rect x="0" y="0" width="1080" height="830" rx="0" fill="#f8fafb" stroke="none" stroke-width="1.5"/>
<text x="30" y="48" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="33" fill="#183448" text-anchor="start">Inside the distance estimator</text>
<text x="30" y="80" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="19" fill="#183448" text-anchor="start">Shapes below are per sign. Image tensors use channels × height × width.</text>
<rect x="30" y="109" width="324" height="455" rx="10" fill="#e7f2fa" stroke="#b1cbda" stroke-width="1.5"/>
<text x="46" y="146" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="22" fill="#183448" text-anchor="start">Whole camera frame</text>
<text x="46" y="174" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#183448" text-anchor="start">Bilinear resize to 48 × 32 pixels</text>
<text x="46" y="210" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">RGB input</text>
<text x="46" y="237" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">3 × 32 × 48</text>
<text x="46" y="274" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">5 × 5 conv · stride 2 · pad 2 · ReLU</text>
<text x="46" y="301" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">12 × 16 × 24</text>
<text x="46" y="338" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">3 × 3 conv · stride 2 · pad 1 · ReLU</text>
<text x="46" y="365" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">16 × 8 × 12</text>
<text x="46" y="402" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">Adaptive average pool to 2 × 2</text>
<text x="46" y="429" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">16 × 2 × 2</text>
<text x="46" y="466" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">Flatten</text>
<text x="46" y="493" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">64</text>
<text x="46" y="530" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">Linear 64 → 12 · ReLU</text>
<text x="46" y="557" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">12 features</text>
<rect x="378" y="109" width="324" height="455" rx="10" fill="#e7f4ef" stroke="#accfc1" stroke-width="1.5"/>
<text x="394" y="146" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="22" fill="#183448" text-anchor="start">Selected sign crop</text>
<text x="394" y="174" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#183448" text-anchor="start">Bilinear resize to 48 × 24 pixels</text>
<text x="394" y="210" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">RGB input</text>
<text x="394" y="237" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">3 × 24 × 48</text>
<text x="394" y="274" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">5 × 5 conv · stride 2 · pad 2 · ReLU</text>
<text x="394" y="301" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">12 × 12 × 24</text>
<text x="394" y="338" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">3 × 3 conv · stride 2 · pad 1 · ReLU</text>
<text x="394" y="365" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">16 × 6 × 12</text>
<text x="394" y="402" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">Adaptive average pool to 2 × 2</text>
<text x="394" y="429" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">16 × 2 × 2</text>
<text x="394" y="466" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">Flatten</text>
<text x="394" y="493" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">64</text>
<text x="394" y="530" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">Linear 64 → 12 · ReLU</text>
<text x="394" y="557" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">12 features</text>
<rect x="726" y="109" width="324" height="455" rx="10" fill="#fcf3e5" stroke="#dbc7a3" stroke-width="1.5"/>
<text x="742" y="146" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="22" fill="#183448" text-anchor="start">Box and frame geometry</text>
<text x="742" y="174" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#183448" text-anchor="start">13 measurements from original pixels</text>
<text x="742" y="210" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">Geometry input</text>
<text x="742" y="237" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">13 values</text>
<text x="742" y="272" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#183448" text-anchor="start">Scale and aspect ratios, box center,</text>
<text x="742" y="294" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#183448" text-anchor="start">frame proportions and four flags</text>
<text x="742" y="316" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#183448" text-anchor="start">for contact with the image edges.</text>
<text x="742" y="402" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">Linear 13 → 48 · ReLU</text>
<text x="742" y="429" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">48</text>
<text x="742" y="530" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#183448" text-anchor="start">Linear 48 → 32 · ReLU</text>
<text x="742" y="557" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#183448" text-anchor="start">32 features</text>
<path d="M192 565 V588" stroke="#566b78" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M540 565 V588" stroke="#566b78" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M888 565 V588" stroke="#566b78" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="30" y="592" width="1020" height="51" rx="10" fill="#1f4051" stroke="none" stroke-width="1.5"/>
<text x="540" y="625" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="white" text-anchor="middle">Concatenate the three vectors    •    12 + 12 + 32 = 56 features</text>
<path d="M540 643 V665" stroke="#566b78" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="135" y="669" width="810" height="50" rx="10" fill="#e8eef1" stroke="#b3c2c9" stroke-width="1.5"/>
<text x="540" y="701" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="18" fill="#183448" text-anchor="middle">Linear 56 → 36  ·  ReLU  ·  Dropout 10% during training  ·  Linear 36 → 3</text>
<path d="M540 720 V741" stroke="#566b78" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="220" y="745" width="640" height="52" rx="10" fill="#dceee5" stroke="#a7c9b4" stroke-width="1.5"/>
<text x="540" y="778" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="18" fill="#183448" text-anchor="middle">3 scores    →    highest score selects near, medium or far</text>
</svg>
